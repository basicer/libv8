name: Build for Windows
description: 'Build V8 for Windows'

inputs:
  archive-name:
    description: 'Base name of the archive to create'
    default: v8_Windows
    required: false
    type: string

runs:
  using: "composite"
  steps:
    - name: Restore SCCache
      uses: actions/cache@v4
      with:
        path: .sccache
        key: ${{ runner.os }}-${{ runner.arch }}:libv8:sccache:${{ github.run_number }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}:libv8:sccache:

    - name: Setup Scoop
      uses: MinoruSekine/setup-scoop@v4

    - name: Setup Build Tools
      shell: pwsh
      run: |
        scoop install sccache

        $sccacheDir = "$Env:GITHUB_WORKSPACE`\.sccache"
        New-Item -Path "$sccacheDir" -ItemType Directory -Force

        Write-Output "SCCACHE_DIR=$sccacheDir" | Out-File -FilePath "$Env:GITHUB_ENV" -Encoding utf8

    - name: Select Windows SDK Required by V8
      id: setup-windows-sdk
      shell: pwsh
      run: |
        $sdkIncludeRoot = 'C:\Program Files (x86)\Windows Kits\10\Include'
        if (-not (Test-Path $sdkIncludeRoot)) {
          throw "Windows SDK include root was not found at $sdkIncludeRoot."
        }

        $availableSdkDirs = Get-ChildItem -Path $sdkIncludeRoot -Directory |
          Where-Object {
            $version = $null
            [version]::TryParse($_.Name, [ref]$version)
          } |
          Sort-Object @{ Expression = { [version]$_.Name }; Descending = $true }
        $sdk = $availableSdkDirs |
          Where-Object {
            (Test-Path (Join-Path $_.FullName 'ucrt\stdio.h')) -and
            (Test-Path (Join-Path $_.FullName 'um\windows.h'))
          } |
          Select-Object -First 1

        if (-not $sdk) {
          $availableSdkVersions = Get-ChildItem -Path $sdkIncludeRoot -Directory | Select-Object -ExpandProperty Name
          $foundVersions = if ($availableSdkVersions) { $availableSdkVersions -join ', ' } else { '(none)' }
          throw "No usable Windows SDK was found under $sdkIncludeRoot. Expected a versioned Include directory containing ucrt\stdio.h and um\windows.h. Found: $foundVersions"
        }

        $sdkVersion = $sdk.Name
        $sdkVersionForEnv = "$sdkVersion\"
        $sdkRoot = (Split-Path -Path $sdkIncludeRoot -Parent) + '\'

        Write-Host "Using Windows SDK $sdkVersion from $sdkRoot"
        "WindowsSdkDir=$sdkRoot" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
        "WindowsSDKVersion=$sdkVersionForEnv" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
        "INCLUDE=" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
        "sdk-version=$sdkVersion" | Out-File -FilePath $Env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Download V8 Source
      shell: cmd
      run: .\v8_download.bat

    - name: Align V8 Toolchain SDK Version
      shell: pwsh
      env:
        SDK_VERSION: ${{ steps.setup-windows-sdk.outputs.sdk-version }}
      run: |
        $files = @(
          '.\v8\build\toolchain\win\setup_toolchain.py'
        )

        foreach ($file in $files) {
          if (-not (Test-Path $file)) {
            throw "Expected V8 toolchain file was not found: $file"
          }

          $content = Get-Content -Path $file -Raw
          $updated = $content -replace '(?m)^\s*SDK_VERSION\s*=\s*[''"][^''"]+[''"]$', "SDK_VERSION = '$Env:SDK_VERSION'"

          if ($updated -eq $content) {
            throw "Failed to update SDK_VERSION in $file"
          }

          [System.IO.File]::WriteAllText((Resolve-Path $file), $updated, [System.Text.UTF8Encoding]::new($false))
        }

    - name: Compile V8
      shell: cmd
      run: .\v8_compile.bat

    - name: Show SCCache Status
      shell: pwsh
      run: sccache --show-stats

    - name: Setup Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        sdk: ${{ steps.setup-windows-sdk.outputs.sdk-version }}

    - name: Test V8
      shell: cmd
      run: .\v8_test.bat

    - name: Archive V8
      shell: pwsh
      run: .\archive.bat ${{ inputs.archive-name }}
