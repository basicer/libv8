name: Build for Windows
description: 'Build V8 for Windows'

inputs:
  archive-name:
    description: 'Base name of the archive to create'
    default: v8_Windows
    required: false
    type: string

runs:
  using: "composite"
  steps:
    - name: Restore SCCache
      uses: actions/cache@v4
      with:
        path: .sccache
        key: ${{ runner.os }}-${{ runner.arch }}:libv8:sccache:${{ github.run_number }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}:libv8:sccache:

    - name: Setup Scoop
      uses: MinoruSekine/setup-scoop@v4

    - name: Setup Build Tools
      shell: pwsh
      run: |
        scoop install sccache

        $sccacheDir = "$Env:GITHUB_WORKSPACE`\.sccache"
        New-Item -Path "$sccacheDir" -ItemType Directory -Force

        Write-Output "SCCACHE_DIR=$sccacheDir" | Out-File -FilePath "$Env:GITHUB_ENV" -Encoding utf8

    - name: Install Windows SDK Required by V8
      shell: pwsh
      run: |
        $minimumWindowsSdkVersion = [version]'10.0.26100.0'

        function Test-UsableWindowsSdk {
          $sdkIncludeRoot = 'C:\Program Files (x86)\Windows Kits\10\Include'
          if (-not (Test-Path $sdkIncludeRoot)) {
            return $false
          }

          return [bool](Get-ChildItem -Path $sdkIncludeRoot -Directory |
            Where-Object {
              $version = $null
              [version]::TryParse($_.Name, [ref]$version) -and $version -ge $minimumWindowsSdkVersion
            } |
            Where-Object {
              (Test-Path (Join-Path $_.FullName 'ucrt\stdio.h')) -and
              (Test-Path (Join-Path $_.FullName 'um\windows.h'))
            } |
            Select-Object -First 1)
        }

        $requiredWindowsSdkId = 'Microsoft.WindowsSDK.10.0.26100'
        if (Test-UsableWindowsSdk) {
          Write-Host 'A usable Windows SDK is already installed.'
          exit 0
        }

        Write-Host 'Initializing winget package sources.'
        winget list --id $requiredWindowsSdkId --exact --source winget --accept-source-agreements --disable-interactivity | Out-Null
        if ($LASTEXITCODE -ne 0) {
          Write-Warning "winget source initialization exited with code $LASTEXITCODE. Continuing with SDK installation."
        }

        Write-Host "Installing $requiredWindowsSdkId via winget because no usable Windows SDK is installed."
        winget install --id $requiredWindowsSdkId --exact --source winget --accept-package-agreements --accept-source-agreements --disable-interactivity --silent
        $wingetExitCode = $LASTEXITCODE
        if ($wingetExitCode -ne 0) {
          Write-Warning "winget exited with code $wingetExitCode while installing $requiredWindowsSdkId. Verifying SDK availability before failing."
        }

        $verificationScript = @'
        $minimumWindowsSdkVersion = [version]'10.0.26100.0'
        $sdkIncludeRoot = "C:\Program Files (x86)\Windows Kits\10\Include"
        if (-not (Test-Path $sdkIncludeRoot)) {
          exit 1
        }

        $sdk = Get-ChildItem -Path $sdkIncludeRoot -Directory |
          Where-Object {
            $version = $null
            [version]::TryParse($_.Name, [ref]$version) -and $version -ge $minimumWindowsSdkVersion
          } |
          Where-Object {
            (Test-Path (Join-Path $_.FullName "ucrt\stdio.h")) -and
            (Test-Path (Join-Path $_.FullName "um\windows.h"))
          } |
          Select-Object -First 1

        if ($sdk) {
          exit 0
        }

        exit 1
        '@
        & pwsh -NoLogo -NoProfile -Command $verificationScript
        if ($LASTEXITCODE -ne 0) {
          if ($wingetExitCode -ne 0) {
            throw "winget exited with code $wingetExitCode while installing $requiredWindowsSdkId, and a usable Windows SDK still was not found."
          }

          throw "winget installed $requiredWindowsSdkId, but a usable Windows SDK still was not found."
        }

    - name: Select Windows SDK Required by V8
      id: setup-windows-sdk
      shell: pwsh
      run: |
        $minimumWindowsSdkVersion = [version]'10.0.26100.0'
        $sdkIncludeRoot = 'C:\Program Files (x86)\Windows Kits\10\Include'
        if (-not (Test-Path $sdkIncludeRoot)) {
          throw "Windows SDK include root was not found at $sdkIncludeRoot."
        }

        $availableSdkDirs = Get-ChildItem -Path $sdkIncludeRoot -Directory |
          Where-Object {
            $version = $null
            [version]::TryParse($_.Name, [ref]$version) -and $version -ge $minimumWindowsSdkVersion
          } |
          Sort-Object @{ Expression = { [version]$_.Name }; Descending = $true }
        $sdk = $availableSdkDirs |
          Where-Object {
            (Test-Path (Join-Path $_.FullName 'ucrt\stdio.h')) -and
            (Test-Path (Join-Path $_.FullName 'um\windows.h'))
          } |
          Select-Object -First 1

        if (-not $sdk) {
          $availableSdkVersions = Get-ChildItem -Path $sdkIncludeRoot -Directory | Select-Object -ExpandProperty Name
          $foundVersions = if ($availableSdkVersions) { $availableSdkVersions -join ', ' } else { '(none)' }
          throw "No usable Windows SDK was found under $sdkIncludeRoot. Expected a versioned Include directory at version $minimumWindowsSdkVersion or newer containing ucrt\stdio.h and um\windows.h. Found: $foundVersions"
        }

        $sdkVersion = $sdk.Name
        $sdkVersionForEnv = "$sdkVersion\"
        $sdkRoot = (Split-Path -Path $sdkIncludeRoot -Parent) + '\'

        Write-Host "Using Windows SDK $sdkVersion from $sdkRoot"
        "WindowsSdkDir=$sdkRoot" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
        "WindowsSDKVersion=$sdkVersionForEnv" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
        "INCLUDE=" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
        "sdk-version=$sdkVersion" | Out-File -FilePath $Env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Download V8 Source
      shell: cmd
      run: .\v8_download.bat

    - name: Compile V8
      shell: cmd
      run: .\v8_compile.bat

    - name: Show SCCache Status
      shell: pwsh
      run: sccache --show-stats

    - name: Setup Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        sdk: ${{ steps.setup-windows-sdk.outputs.sdk-version }}

    - name: Test V8
      shell: cmd
      run: .\v8_test.bat

    - name: Archive V8
      shell: pwsh
      run: .\archive.bat ${{ inputs.archive-name }}
